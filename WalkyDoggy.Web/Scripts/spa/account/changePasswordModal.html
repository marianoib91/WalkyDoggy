<form class="wd-dialog" name="formularioContrasena" novalidate ng-submit="guardar()">
    <h2 class="wd-dialog-title">Cambiar contraseña</h2>

    <div class="form-group">
        <label for="contrasena-actual">Contraseña actual</label>
        <input type="password" id="contrasena-actual" class="form-control" ng-model="datos.actual" autocomplete="current-password" maxlength="50" autofocus />
    </div>
    <div class="form-group">
        <label for="contrasena-nueva">Contraseña nueva</label>
        <input type="password" id="contrasena-nueva" class="form-control" ng-model="datos.nueva" autocomplete="new-password" maxlength="50" />
        <span class="wd-field-hint">Entre 6 y 50 caracteres.</span>
    </div>
    <div class="form-group">
        <label for="contrasena-repetida">Repetí la contraseña nueva</label>
        <input type="password" id="contrasena-repetida" class="form-control" ng-model="datos.repetida" autocomplete="new-password" maxlength="50" />
    </div>

    <p class="wd-form-error" ng-if="error" role="alert">{{error}}</p>

    <div class="wd-dialog-actions">
        <button type="button" class="btn btn-default" ng-click="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" ng-disabled="guardando">Guardar</button>
    </div>
</form>
