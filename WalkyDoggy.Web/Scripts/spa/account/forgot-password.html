<div class="row">
    <div class="col-md-12 text-center forgot-password-title">
        <h3 class="">Ingrese su dirección de email y se le enviará su nueva contraseña</h3>
    </div>
    <form class="form-signin" role="form" novalidate angular-validator name="userForgotPasswordForm" angular-validator-submit="recoverPassword()">
        <div class="form-group">
            <label for="inputEmail" class="sr-only">Email</label>
            <input type="text"
                   id="inputEmail"
                   name="inputEmail"
                   class="form-control"
                   ng-model="user.email"
                   placeholder="Email"
                   validate-on="blur"
                   required
                   required-message="'Debe ingresar un Email'">
        </div>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Recuperar contraseña</button>
    </form>
</div>
