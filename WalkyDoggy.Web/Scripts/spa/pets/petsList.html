<div class="pets-list">
    <div class="wd-page-header">
        <div>
            <h1 class="wd-page-title">Mis mascotas</h1>
            <p class="wd-page-subtitle" ng-if="pets.length>0">Los perros que podés sumar a tus paseos.</p>
            <p class="wd-page-subtitle" ng-if="pets.length==0">Todavía no cargaste ninguna mascota.</p>
        </div>
    </div>
    <div class="wd-pet-grid">
        <article class="wd-pet-card" ng-repeat="pet in pets">
            <div class="wd-pet-head">
                <img class="wd-avatar wd-avatar-sm" ng-src="{{pet.profileImage || '/Content/images/avatar-pet.svg'}}" alt="Foto de {{pet.name}}" />
                <h2 class="wd-pet-name">{{pet.name}}</h2>
            </div>
            <div class="wd-chips">
                <span class="wd-chip">Raza: {{pet.breedName}}</span>
                <span class="wd-chip">Tamaño: {{pet.sizeName}}</span>
                <span class="wd-chip">{{pet.age}} años</span>
            </div>
            <p class="wd-pet-desc">{{pet.description}}</p>
            <div class="wd-card-actions">
                <button type="button" class="btn btn-default" ng-click="edit(pet.id)">
                    <i class="fa fa-pencil" aria-hidden="true"></i>
                    Editar
                </button>
                <button type="button" class="btn btn-danger" ng-click="delete(pet.id)">
                    <i class="fa fa-trash-o" aria-hidden="true"></i>
                    Eliminar
                </button>
            </div>
        </article>
        <button type="button" class="wd-pet-add" ng-click="edit(0)">
            <span class="wd-pet-add-icon"><i class="fa fa-plus" aria-hidden="true"></i></span>
            Agregar mascota
        </button>
    </div>
</div>
