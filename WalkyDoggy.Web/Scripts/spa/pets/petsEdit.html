<div class="pets-edit">
    <div class="wd-page-header">
        <div>
            <h1 class="wd-page-title" ng-if="petId!=0">Editar mascota</h1>
            <h1 class="wd-page-title" ng-if="petId==0">Agregar nueva mascota</h1>
            <p class="wd-page-subtitle">Esta es la tarjeta de presentación de tu mascota.</p>
        </div>
    </div>
    <form class="wd-form-layout" role="form" novalidate angular-validator name="userRegistrationForm" angular-validator-submit="updatePet()">
        <aside class="wd-side-card">
            <img class="wd-avatar wd-avatar-lg" ng-src="{{previewImage || pet.profileImage || '/Content/images/avatar-pet.svg'}}" alt="Foto de la mascota" />
            <div class="wd-side-name">{{pet.name || 'Nueva mascota'}}</div>
            <div class="file-upload-container">
                <label class="btn btn-default" for="upload-photo">
                    <i class="fa fa-camera" aria-hidden="true"></i>
                    Cambiar foto
                </label>
                <input type="file" name="photo" id="upload-photo" ng-file-select="onPhotoSelected($files)" />
            </div>
            <p class="wd-side-hint">JPG, PNG o GIF, hasta 5 MB.</p>
        </aside>
        <div class="wd-form-card">
            <section class="wd-form-section">
                <h2 class="wd-form-section-title">Datos de la mascota</h2>
                <div class="wd-form-grid">
                    <div class="form-group">
                        <label for="inputName">Nombre</label>
                        <input type="text"
                               id="inputName"
                               name="inputName"
                               class="form-control"
                               ng-model="pet.name"
                               placeholder="Nombre"
                               validate-on="blur"
                               required
                               required-message="'Nombre es requerido.'">
                    </div>
                    <div class="form-group">
                        <label for="inputAge">Edad</label>
                        <input type="number"
                               id="inputAge"
                               name="inputAge"
                               class="form-control"
                               ng-model="pet.age"
                               placeholder="Edad"
                               validate-on="blur"
                               required
                               required-message="'Edad es requerido.'">
                    </div>
                    <div class="form-group">
                        <label for="inputBreed">Raza</label>
                        <select type="text"
                                id="inputBreed"
                                name="inputBreed"
                                class="form-control"
                                ng-model="pet.breedId"
                                ng-options="breed.id as breed.name for breed in breeds"
                                validate-on="blur"
                                required
                                required-message="'Raza es requerido.'">
                            <option value="" disabled selected>Seleccione una raza</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="inputSize">Tamaño</label>
                        <select type="text"
                                id="inputSize"
                                name="inputCity"
                                class="form-control"
                                ng-model="pet.sizeId"
                                ng-options="size.id as size.name for size in sizes"
                                validate-on="blur"
                                required
                                required-message="'Tamaño es requerido.'">
                            <option value="" disabled selected>Seleccione un tamaño</option>
                        </select>
                    </div>
                    <div class="form-group wd-span-2">
                        <label for="inputDescription">Descripción</label>
                        <textarea type="text"
                                  rows="3"
                                  id="inputDescription"
                                  name="inputDescription"
                                  class="form-control"
                                  placeholder="Ingrese una breve descripción de su mascota"
                                  ng-model="pet.description"
                                  validate-on="blur"
                                  required
                                  required-message="'Descripción es requerido.'"></textarea>
                    </div>
                </div>
            </section>
            <div class="wd-form-footer">
                <a class="btn btn-default" href="#/pets/list" style="margin-right:12px">Cancelar</a>
                <button class="btn btn-primary" type="submit">Guardar cambios</button>
            </div>
        </div>
    </form>
</div>
